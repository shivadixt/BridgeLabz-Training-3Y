<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <h1>XYZ public School</h1>

    <h2>Student Report Card</h2>

    <table border="1" title="Student Marks Report">
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>94</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>86</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>98</td>
        </tr>

        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>84</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td title="Total marks obtained">450 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td>90.0%</td>
        </tr>
    </table>

</body>
</html>
