<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 19</title>
</head>

<body>
    <form autocomplete="off">

        <label for="name">Full Legal Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Official Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="password">Master Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <input type="submit" value="Create Secure Account">

    </form>

    <p>
        Security Tip: Disabling browser autocomplete prevents sensitive credentials
        from being cached or automatically populated on shared or public workstations.
    </p>

</body>

</html>
