<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 10</title>
</head>
<body>
    <form action="">
        <label for="name">Your Full Name</label>
        <input type="text" name="name" id="name" placeholder="e.g. John Doe" required>
        <br>
        <label for="email">Your Email Address</label>
        <input type="email" name="email" id="email" placeholder="john@example.com" required>
        <br>
        <label for="subject">Inquiry Subject</label>
        <input type="text" name="subject" id="subject" placeholder="General Inquiry" required>
        <br>
        <textarea name="message" id="message" placeholder="Type your inquiry or message here..."></textarea>
    </form>
</body>
</html>
